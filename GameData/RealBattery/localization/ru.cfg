        // === Alarms / Messages === //

        #LOC_RB_DeplAlarmTitle = Battery Depletion for <<1>>.

        #LOC_RB_DeplToastMsg = Скоро на аппарате <<1>> сядут батареи!

        #LOC_RB_DeplToastMsg_A = We've lost contact with <<1>>. Maybe someone left the toaster on up there. Might be time to take a look.
        #LOC_RB_DeplToastMsg_B = Похоже, что <<1>> еле фурычит. Вы ведь не забыли включить генераторы?
        #LOC_RB_DeplToastMsg_C = Связь с <<1>> гаснет. Рекомендуется отключение второстепенных систем.
        #LOC_RB_DeplToastMsg_D = Внимание: <<1>> сейчас ляжет, если не подзарядится.
        #LOC_RB_DeplToastMsg_E = <<1>> is moments away from a blackout. Find sunlight, fast!

        #LOC_RB_Toast_BatteryEOL_Title = Battery end-of-life
