        // === Difficulty Settings === //

        #LOC_RB_Settings_Tab_Simulation = Симуляция
        #LOC_RB_Settings_Tab_Advanced = Расширенные настройки
        #LOC_RB_Settings_Tab_Debug = Инструменты разработчика

        #LOC_RB_Settings_SelfDischarge = Включить саморазряд
        #LOC_RB_Settings_SelfDischarge_desc = Аккумуляторы будут медленно терять заряд со временем, пока их не используют.

        #LOC_RB_Settings_BatteryWear = Включить деградацию аккумуляторов
        #LOC_RB_Settings_BatteryWear_desc = Аккумуляторы будут медленно изнашиваться с каждым циклом заряда и разряда.

        #LOC_RB_Settings_HeatProduction = Включить выделение тепла
        #LOC_RB_Settings_HeatProduction_tip = Аккумуляторы выделяют тепло при заряде или разряде. Перегрев ускоряет деградацию аккумуляторов.

        #LOC_RB_Settings_UseSystemHeat = Использовать SystemHeat
        #LOC_RB_Settings_UseSystemHeat_tip = Направлять тепло от аккумуляторов через SystemHeat вместо стоковой тепловой модели. Требуется установленный SystemHeat.

        #LOC_RB_Settings_CryoWHM = Cryo Waste Heat Mode
        #LOC_RB_Settings_CryoWHM_tip = Cryo batteries produce a fixed SystemHeat waste heat instead of consuming ElectricCharge for thermal upkeep (similar to CryoTanks).

        #LOC_RB_Settings_CosmeticToasts = Cosmetic messages
        #LOC_RB_Settings_CosmeticToasts_tip = Show flavor-text toast messages for low-power warnings, reduced thermal capacity, and battery overheat. Battery end-of-life and self-runaway warnings are always shown.

        #LOC_RB_Settings_LowPowerAlarm = Low-power alarm
        #LOC_RB_Settings_LowPowerAlarm_tip = Create an alarm when a vessel will run out of power while inactive.

        #LOC_RB_Settings_UseKAC = Use Kerbal Alarm Clock
        #LOC_RB_Settings_UseKAC_tip = Create low-power alarms using KAC instead of the stock Alarm Clock (toggling this option will delete any RealBattery alarm).

        #LOC_RB_Settings_LowPowerMinWindow = Minimum window (min)
        #LOC_RB_Settings_LowPowerMinWindow_tip = Do not create alarms if the estimated depletion is sooner than this value.

        #LOC_RB_Settings_LowPowerLead = Alarm lead time (min)
        #LOC_RB_Settings_LowPowerLead_tip = How many minutes before depletion the alarm/message should fire.

        #LOC_RB_Set_EnableEVARefurbish = Enable EVA battery replacement
        #LOC_RB_Set_EnableEVARefurbish_desc = Позволяет инженерам во время ВКД полностью заменять аккумуляторы при помощи запасных частей.

        #LOC_RB_Settings_ThermalRunaway = Реалистичный тепловой разгон
        #LOC_RB_Settings_ThermalRunaway_tip = Если включено, аккумуляторы при тепловом разгоне будут нагреваться даже после их отключения.

        #LOC_RB_Settings_KeepWarmFrac = Поддержание температуры аккумуляторов
        #LOC_RB_Settings_KeepWarmFrac_tip = Часть энергии при разряде батарей KERBA будет направлена на их поддержание их температуры.

        #LOC_RB_Settings_RunawayMagnitude_title = Интенсивность теплового разгона
        #LOC_RB_Settings_RunawayMagnitude_desc = Определяет, насколько быстро будет происходить тепловой разгон и насколько сильными будут его эффекты.

        // Deprecated
        #LOC_RB_Settings_SelfRunawayChance = Self-runaway probability
        // Deprecated
        #LOC_RB_Settings_SelfRunawayChance_tip = Sets the hourly probability that a hafnium-based battery will spontaneously trigger a self-runaway event (set 0 to disable).

        #LOC_RB_Settings_SelfRunawayMultiplier = Множитель случайного теплового разгона
        #LOC_RB_Settings_SelfRunawayMultiplier_tip = Определяет шанс спонтанного теплового разгона. 1.0 = номинальный; 0 = выключен. Затрагивает лишь аккумуляторы с радиоактивными веществами.

        #LOC_RB_Settings_SelfRunawayBG = Allow background R.I.P. events
        #LOC_RB_Settings_SelfRunawayBG_tip = When enabled, radioactive cells can spontaneously fail while the vessel is unloaded (background simulation). Disable to prevent unexpected cell loss during time-warp.

        #LOC_RB_Settings_PolarThreshold = Polar latitude threshold
        #LOC_RB_Settings_PolarThreshold_tip = When landed/splashed above this latitude, solar production is treated as constant instead of day/night cycles in background simulation.

        #LOC_RB_Settings_PolarFrac = Polar solar efficiency
        #LOC_RB_Settings_PolarFrac_tip = Average fraction of solar power produced when landed/splashed at the poles (+/- 90° latitude).

        #LOC_RB_DayLenght = Solar day length (hours)
        #LOC_RB_DayLenght_desc = 0: Auto (Kerbin/Homeworld). Otherwise a fixed number of hours (1-24).

        #LOC_RB_DeepSpaceProtection = Deep-space protection
        #LOC_RB_DeepSpaceProtection_tip = Reduces battery wear in deep-space transfers by suppressing float-charge in background.
        
        #LOC_RB_DisablePCM = Disable PCM
        #LOC_RB_DisablePCM_desc = When selected, Protection Circuit Module will no longer disable batteries when reaching overheat temperature.

        #LOC_RB_DisableBackgroundSim = Выключить симуляцию в фоновом режиме
        #LOC_RB_DisableBackgroundSim_tip = Аккумуляторы незагруженных аппаратов не будут заряжаться, разряжаться, изнашиваться или не испытывать эффекты теплового разгона.

        #LOC_RB_Log = Enable debug logs
