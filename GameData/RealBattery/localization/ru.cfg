        #LOC_RB_descDet_decal_TBat = - <b>ОЗНАКОМИТЬСЯ И ПРИНЯТЬ К СВЕДЕНИЮ</b> все процедуры зажигания перед поджигом пиростартёра.\n- <b>ДЕРЖАТЬ ПОДАЛЬШЕ</b> от линий зажигания ТРУ, летучего топлива и любопытных стажёров\n- После активации этот аккумулятор не перестанет вырабатывать мощность.\n- Тепловыделение может превышать комфортный уровень. Работать в изолированных перчатках.
        #LOC_RB_descDet_decal_PbAc = - <b>ХРАНИТЬ ВЕРТИКАЛЬНО:</b> кислота должна оставаться внутри корпуса.\n- <b>НЕ МЕНЯТЬ ПОЛЯРНОСТЬ</b> или ориентацию корабля.\n- <b>КОРРОЗИЙНОЕ ВЕЩЕСТВО:</b> длительный контакт может разъесть близлежащие поверхности.\n- Не использовать для перезапуска севших роверов.\n- Не пригоден для космических полётов.
        #LOC_RB_descDet_decal_NiCd = - <b>НЕ ИСПОЛЬЗОВАТЬ В КАЧЕСТВЕ ПРОТИВОВЕСА.</b>\n- <b>УТИЛИЗИРОВАТЬ ОТВЕТСТВЕННО:</b> кадмий не разлагается и не съедобен.\n- <b>РЕКОМЕНДУЕМОЕ МЕСТО ХРАНЕНИЯ:</b> там, где вы не ожидаете увидеть ваш персонал.\n- Будет тихо гудеть при неправильном обращении. ЭТО НЕ ШТАТНАЯ РАБОТА.
        #LOC_RB_descDet_decal_NiZn = - <b>ЭНЕРГИЧНЫЙ РАЗРЯД.</b> Рекомендуется умеренное использование.\n- <b>МОЖЕТ ВЫЗВАТЬ КОРРОЗИЮ КЛЕММ</b>, экспериментальных образцов и систем жизнеобеспечения.\n- <b>ХРАНИТЬ В ПРОХЛАДНОМ, СУХОМ, ЖЕЛАТЕЛЬНО ОТДАЛЁННОМ МЕСТЕ.</b>\n- <b>ПРОВЕРЯЙТЕ ОХЛАЖДЕНИЕ ДВАЖДЫ:</b> самоуверенность аннулирует гарантию и аппарат.
        #LOC_RB_descDet_decal_AgOx = - <b>НЕ ПЫТАТЬСЯ ЗАРЯДИТЬ:</b> создан для миссий в один конец.\n- <b>ДЕРЖАТЬ ПОДАЛЬШЕ ОТ ПРЯМЫХ СОЛНЕЧНЫХ ЛУЧЕЙ,</b> растворителей и любопытных стажёров.\n- <b>БЛЕСТЯЩЕЕ НЕ ЗНАЧИТ СЪЕДОБНОЕ.</b> Не пытайтесь проверить эту гипотезу.\n- Не одобрено для взлома автоматов с закусками.
        #LOC_RB_descDet_decal_AgZn = - <b>ВЫСОКОАКТИВНАЯ ХИМИЯ.</b> Это не игрушка.\n- <b>ДЕРЖАТЬ ПОДАЛЬШЕ ОТ ПРЯМЫХ СОЛНЕЧНЫХ ЛУЧЕЙ,</b> растворителей и любопытных стажёров.\n- <b>БЛЕСТЯЩЕЕ НЕ ЗНАЧИТ СЪЕДОБНОЕ.</b> Не пытайтесь проверить эту гипотезу.\n- Не одобрено для взлома автоматов с закусками.
        #LOC_RB_descDet_decal_NiH2 = - <b>ГЕРМЕТИЧНАЯ СИСТЕМА:</b> обращаться с осторожностью.\n- <b>НЕ ИСПОЛЬЗОВАТЬ КАК ВОЗДУШНЫЙ ШАРИК.</b>\n- <b>ДЕРЖАТЬ ПОДАЛЬШЕ ОТ ОТКРЫТОГО ПЛАМЕНИ</b> если только вы не планировали сходить с орбиты.\n- <b>НЕ РАЗБИРАТЬ</b>, не сминать, не прокалывать и не использовать в качестве аварийного топливного бака.
        #LOC_RB_descDet_decal_Zebra = - <b>ТРЕБУЕТ ПРЕДВАРИТЕЛЬНОГО ПРОГРЕВА:</b> не проверять готовность к работе на язык.\n- <b>ТРЕБУЕТ ОХЛАЖДЕНИЯ ПОСЛЕ ОТКЛЮЧЕНИЯ:</b> свечение НЕ является показателем производительности.\n- <b>НЕ ГРЕЛКА ДЛЯ РУК</b> (если вы не настаиваете).\n- Лучше всего работает в тепловых контурах с чем-то значительно более горячим поблизости.
        #LOC_RB_descDet_decal_Li_ion = - <b>ИСПЫТАНИЯ ПРОКОЛОМ АННУЛИРУЮТ ГАРАНТИЮ</b>.\n- <b>ЗАРЯЖАТЬ ТОЛЬКО СЕРТИФИЦИРОВАННЫМИ РЕГУЛЯТОРАМИ.</b> Самодельные адаптеры зачастую становятся источниками возгорания.\n- Системы пожаротушения должны быть рассчитаны на инциденты с участием лития, а не на оптимизм.\n- Вздутие, запах или шипение — ранние признаки провала миссии
        #LOC_RB_descDet_decal_Li_poly = - <b>НЕ СГИБАТЬ,</b> не сжимать и не провоцировать вздутие.\n- <b>ИЗБЕГАТЬ ЧРЕЗМЕРНОГО НАГРЕВА,</b> холода или любопытства.\n- <b>ИЗБЫТОЧНЫЙ ИЛИ НУЛЕВОЙ ЗАРЯД</b> может вызвать необратимую потерю мощности и целостности.\n- Не хранить под давлением, рядом с топливными магистралями или внутри отсеков для закусок.
        #LOC_RB_descDet_decal_Graphene = - <b>ВНИМАНИЕ:</b> не может использоваться как тепловой щит (мы уже пробовали).\n- <b>ИЗБЕГАТЬ КОНТАКТА С КОЖЕЙ</b> во время работы.\n- <b>УТИЛИЗИРОВАТЬ ЧЕРЕЗ СЕРТИФИЦИРОВАННЫЙ ПЕРЕРАБАТЫВАЮЩИЙ ЦЕНТР:</b> несанкционированное обращение аннулирует гарантию. Возврат денег не производится.\n- Убедитесь, что проводка и предохранители выдерживают полный скачок напряжения.
        #LOC_RB_descDet_decal_SSB = - <b>НЕ ПРЕВЫШАТЬ НОМИНАЛЬНОЕ ЗАРЯДНОЕ НАПРЯЖЕНИЕ:</b> это не эксперимент.\n- <b>МЕХАНИЧЕСКИЕ УДАРЫ МОГУТ ВЫЗВАТЬ ТРЕЩИНЫ:</b> убедитесь, что пилоты это понимают.\n- Нагрев указывает на неправильный баланс нагрузки.\n- Стабилен при неправильном обращении, если только это обращение не становится креативным.
