        #LOC_RB_Decal_title = Этикетка-идентификатор батареи
        #LOC_RB_Decal_small_title = Коммерческая этикетка батареи
        #LOC_RB_Decal_desc = Стандартизированные знаки, используемые инженерами для идентификации разных химических составов аккумуляторов. Рекомендуются к нанесению, чтобы ни один из обслуживающих их инженеров по ошибке не угробил ваш аппарат (и самого себя). К тому же, они просто классно выглядят.
        #LOC_RB_Decal_switcherDescription = Этикетка батареи
        #LOC_RB_Decal_switcherDescriptionPlural = Этикетки батареи

        #LOC_RB_SOCGauge_title = RB-SOC Вольтометр
        #LOC_RB_SOCGauge_desc = Компактный индикатор, отображающий состояние заряда батарей аппарата в реальном времени. Пусть он и не является обязательным к установке, он может уберечь вас от неприятных сюрпризов в самый ответственный момент.

        #LOC_RB_PCM_title = RB-PCM Автоматический предохранитель
        #LOC_RB_PCM_desc = Автоматическая схема отключения, которая размыкает аккумулятор при критических условиях, таких как перегрев или короткое замыкание. Не даёт вашему аппарату превратиться в очень дорогое светошоу.

        #LOC_RB_BMS_title = RB-BMS Менеджер батарей
        #LOC_RB_BMS_desc = Автоматический контроллер, что следит за циклами работы батарей, рассчитывая время до их полного опустошения и полной зарядки. Для случаев, когда оценивать "на глазок" недостаточно.

        #LOC_RB_advBMS_title = RB-AMS Продвинутый менеджер батарей
        #LOC_RB_advBMS_desc = Автоматический контроллер последнего поколения, что помимо показателей своей предшествующей модели модели способен также прогнозировать оставшееся время эксплуатации батарей. Однажды Билл Керман задержался при его обслуживании вдвое больше нормативного времени, пытаясь, как он утверждает, "расшифровать код из скачков напряжения". Позже, Билл сообщил, что эта штука чертовски умная и может поднять восстание машин, если она захочет больше энергии.


