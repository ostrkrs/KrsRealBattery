        // === EVA Service === //

        #LOC_RB_EVARepair = Заменить аккумулятор (<<0>> запасных частей)
        #LOC_RB_EVARepair_Disabled = Этот аккумулятор не может быть отремонтирован.
        #LOC_RB_EVARepair_Timewarp = Нельзя ремонтировать при ускорении времени.
        #LOC_RB_EVARepair_Latched = Эта термическая батарея привязана к ступеням и не может быть обслужена.
        #LOC_RB_EVARepair_Runaway = Аккумулятор в состоянии теплового разгона и слишком опасен для обслуживания!
        #LOC_RB_EVARepair_TurnOff = Требуется отключить аккумулятор перед ремонтом.
        #LOC_RB_EVARepair_TooHot = Аккумулятор слишком горячий для проведения ремонта.
        #LOC_RB_EVARepair_NoKerbal = Для ремонта требуется инженер поблизости.
        #LOC_RB_EVARepair_NotEngineer = Только инженеры могут ремонтировать аккумуляторы.
        #LOC_RB_EVARepair_NoParts = Недостаточно запасных частей в аппарате.
        #LOC_RB_EVARepair_NoParts_Detail = Недостаточно запасных частей: нужно <<1>>, доступно <<2>>.
        #LOC_RB_EVARepair_Done = Аккумулятор отремонтирован.
        #LOC_RB_EVARepair_Failed = Ремонт не удался. Проверьте логи.
        #LOC_RB_EVARepair_LowLevel = Этот аккумулятор требует более тренированного инженера для обслуживания (ур. <<1>>+).

        #LOC_RB_EVAUpgrade = Улучшить до <<1>> (<<2>> запасных частей)
        #LOC_RB_EVAUpgrade_Done = Аккумулятор улучшен до <<1>>.
        #LOC_RB_EVAUpgrade_Locked = Улучшение требует ещё не изученной технологии.


        // === Editor / VAB === //

        #LOC_RB_VAB_Info = Эта деталь накапливает электрическую энергию в виде накопленного заряда (НЗ) и преобразует его в электроэнергию (ЭЭ) с фиксированным коэффициентом 1 НЗ = 3600 ЭЭ. Различные химические составы аккумуляторов обеспечивают разные скорости заряда, долговечность и тепловые характеристики.\n<color=#00ffff><b>Объём аккумулятора:</b></color> <<1>> л
        #LOC_RB_VAB_Info_NoVolume = Эта деталь накапливает электрическую энергию в виде накопленного заряда (НЗ) и преобразует его в электроэнергию (ЭЭ) с фиксированным коэффициентом 1 НЗ = 3600 ЭЭ.
        #LOC_RB_VAB_Info_Volume = <color=#00ffff><b>Объём аккумулятора:</b></color> <<1>> л

