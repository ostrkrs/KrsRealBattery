        // === EVA Service === //

        #LOC_RB_EVARepair = Заменить аккумулятор (<<0>> запасных частей)
        #LOC_RB_EVARepair_Disabled = Этот аккумулятор не может быть отремонтирован.
        #LOC_RB_EVARepair_Timewarp = Нельзя ремонтировать при ускорении времени.
        #LOC_RB_EVARepair_Latched = Эта термическая батарея привязана к ступеням и не может быть обслужена.
        #LOC_RB_EVARepair_Runaway = Аккумулятор в состоянии теплового разгона и слишком опасен для обслуживания!
        #LOC_RB_EVARepair_TurnOff = Требуется отключить аккумулятор перед ремонтом.
        #LOC_RB_EVARepair_TooHot = Аккумулятор слишком горячий для проведения ремонта.
        #LOC_RB_EVARepair_NoKerbal = Для ремонта требуется инженер поблизости.
        #LOC_RB_EVARepair_NotEngineer = Только инженеры могут ремонтировать аккумуляторы.
        #LOC_RB_EVARepair_NoParts = Недостаточно запасных частей в аппарате.
        #LOC_RB_EVARepair_NoParts_Detail = Недостаточно запасных частей: нужно <<1>>, доступно <<2>>.
        #LOC_RB_EVARepair_Done = Аккумулятор отремонтирован.
        #LOC_RB_EVARepair_Failed = Ремонт не удался. Проверьте логи.
        #LOC_RB_EVARepair_LowLevel = Этот аккумулятор требует более тренированного инженера для обслуживания (ур. <<1>>+).

        #LOC_RB_EVAUpgrade = Улучшить до <<1>> (<<2>> запасных частей)
        #LOC_RB_EVAUpgrade_Done = Аккумулятор улучшен до <<1>>.
        #LOC_RB_EVAUpgrade_Locked = Улучшение требует ещё не изученной технологии.


        // === Editor / VAB === //

        #LOC_RB_VAB_Info = Эта деталь накапливает электрическую энергию в виде накопленного заряда (НЗ) и преобразует его в электроэнергию (ЭЭ) с фиксированным коэффициентом 1 НЗ = 3600 ЭЭ. Различные химические составы аккумуляторов обеспечивают разные скорости заряда, долговечность и тепловые характеристики.\n<color=#00ffff><b>Объём аккумулятора:</b></color> <<1>> л
        #LOC_RB_VAB_Info_NoVolume = Эта деталь накапливает электрическую энергию в виде накопленного заряда (НЗ) и преобразует его в электроэнергию (ЭЭ) с фиксированным коэффициентом 1 НЗ = 3600 ЭЭ.
        #LOC_RB_VAB_Info_Volume = <color=#00ffff><b>Объём аккумулятора:</b></color> <<1>> л

        #LOC_RB_DischargeRate = Скорость разряда
        #LOC_RB_ChargeRate = Скорость зарядки
        
        #LOC_RB_batterySwitcherDescription = Химический состав
        #LOC_RB_batterySwitcherDescriptionPlural = Химические составы

        #LOC_RB_SimMode = Симуляция в редакторе: 
        #LOC_RB_SimMode_Idle = Простаивает
        #LOC_RB_SimMode_Discharge = Разряжается
        #LOC_RB_SimMode_Charge = Заряжается

        #LOC_RB_StageArm = Battery staged
        #LOC_RB_StageArm_on = Armed
        #LOC_RB_StageArm_off = Disarmed

        #LOC_RB_ActionToggleBattery = Переключить батарею
        #LOC_RB_ActionEnableBattery = Включить батарею
        #LOC_RB_ActionDisableBattery = Отключить батарею

        
        // === Alarms / Messages === //

        #LOC_RB_DeplAlarmTitle = Разряжающиеся батареи на <<1>>.

        #LOC_RB_DeplToastMsg = Скоро на аппарате <<1>> кончится энергия!

        #LOC_RB_DeplToastMsg_A = Мы потеряли контакт с <<1>>. Maybe someone left the toaster on up there. Might be time to take a look.
        #LOC_RB_DeplToastMsg_B = Похоже, что <<1>> еле фурычит. Вы ведь не забыли включить генераторы?
        #LOC_RB_DeplToastMsg_C = Связь с <<1>> гаснет. Рекомендуется отключение второстепенных систем.
        #LOC_RB_DeplToastMsg_D = Внимание: <<1>> сейчас ляжет, если не подзарядится.
        #LOC_RB_DeplToastMsg_E = <<1>> вот-вот отключится из-за нехватки энергии. Немедленно подзарядитесь!

        #LOC_RB_Toast_BatteryEOL_Title = Истекающий срок службы аккумуляторов
        #LOC_RB_Toast_BatteryEOL = Аккумуляторы <<1>> достигли конца своего нормативного срока эксплуатации (ёмкость <80%).

        #LOC_RB_Overheat_title = Перегрев аккумулятора
        #LOC_RB_OverheatMsg1 = We noticed an unusual temperature reading in <<1>>. The protection circuit has tripped - hopefully not at the most dramatic moment.
        #LOC_RB_OverheatMsg2 = <<1>> got a bit too toasty. Automatic shutdown engaged. Try not to smell the smoke.
        #LOC_RB_OverheatMsg3 = Safety first: <<1>> exceeded its heat limits. Power was cut to prevent further excitement.

        #LOC_RB_OverheatToast = обнаружен перегрев аккумулятора!
        #LOC_RB_Runaway_detected = обнаружен тепловой разгон аккумулятора!
        #LOC_RB_RIP_SelfRunaway = Spontaneous R.I.P. event detected on <<1>>! Radioactive core has entered self-runaway.

        #LOC_RB_BG_SelfRunaway_title = Background R.I.P. Event
        #LOC_RB_BG_SelfRunaway_msg = A spontaneous runaway occurred on <<1>> aboard <<2>> while you were away. The cell is destroyed.

        #LOC_RB_ThermalCap_title = Thermal threshold exceeded
        #LOC_RB_ThermalCap_body = <<1>> has exceeded its thermal operating limit. Effective capacity is reduced until the system cools down.

        
        // === Battery Chemistries === //

        #LOC_RB_title_TBat = Термический
        #LOC_RB_short_TBat = Терм.
        #LOC_RB_descSum_TBat = <b>С-рейтинг:</b> 6C\n<b>Теплопотери:</b> 60% (макс. T°: 1300 K)\n<b>Саморазряд:</b> 0%\n<#FF0000>Не перезаряжаемый</color>
        #LOC_RB_descDet_TBat = Этот расплавно-солевой аккумулятор не работает при комнатной температуре и активируется пиротехническим зарядом. Имеет очень высокую выходную мощность на коротком промежутке, что делает его подходящим для атмосферных зондов и всего того, что всё равно отправляется в один конец. <#FF0000>После активации не может быть отключен.</color>
        
        #LOC_RB_title_PbAc = Свинцово-кислотный
        #LOC_RB_short_PbAc = Pb-Ac
        #LOC_RB_descSum_PbAc = <b>С-рейтинг:</b> 0.2C\n<b>Теплопотери:</b> 30% (макс. T°: 440 K)\n<b>Саморазряд:</b> 4.5%/сутки\n<b>Ресурс:</b> 75 циклов
        #LOC_RB_descDet_PbAc = Свинцово-кислотный — старейший тип перезаряжаемых аккумуляторов. Надёжный, дешёвый и предсказуемый, но тяжёлый и неэффективный. Идеален, если вы никуда не торопитесь (или если у вас нет другого выбора).

        #LOC_RB_title_NiCd = Никель-кадмиевый
        #LOC_RB_short_NiCd = NiCd
        #LOC_RB_descSum_NiCd = <b>С-рейтинг:</b> 0.5C\n<b>Теплопотери:</b> 20% (макс. T°: 390 K)\n<b>Саморазряд:</b> 3%/сутки\n<b>Ресурс:</b> 500 циклов
        #LOC_RB_descDet_NiCd = Никель-кадмиевые аккумуляторы надёжны и неприхотливы, что делает их экономичным и сбалансированным выбором для самых разных задач. Не выделяются какими-то особыми качествами.

        #LOC_RB_title_NiZn = Никель-цинковый
        #LOC_RB_short_NiZn = NiZn
        #LOC_RB_descSum_NiZn = <b>С-рейтинг:</b> 0.7C\n<b>Теплопотери:</b> 15% (макс. T°: 390 K)\n<b>Саморазряд:</b> 4%/сутки\n<b>Ресурс:</b> 800 циклов
        #LOC_RB_descDet_NiZn = Надёжный продвинутый аккумулятор с неплохим выходным напряжением и энергоёмкостью. Обеспечивает стабильную производительность при умеренной цене, но страдает от малого ресурса и повышенного нагрева при полном заряде.

        #LOC_RB_title_AgOx = Серебряно-оксидный
        #LOC_RB_short_AgOx = Ag-Ox
        #LOC_RB_descSum_AgOx = <b>С-рейтинг:</b> 1C\n<b>Теплопотери:</b> 30% (макс. T°: 420 K)\n<b>Саморазряд:</b> 2.5%/сутки\n<#FF0000>Не перезаряжаемый</color>
        #LOC_RB_descDet_AgOx = Простой аккумулятор с высокой энергоёмкостью, используемый ещё с самой зари космических полётов. Имеет отличную выходную мощность, но, к сожалению, одноразовый.

        #LOC_RB_title_AgZn = Серебряно-цинковый
        #LOC_RB_short_AgZn = Ag-Zn
        #LOC_RB_descSum_AgZn = <b>С-рейтинг:</b> 1.5C\n<b>Теплопотери:</b> 30% (макс. T°: 420 K)\n<b>Саморазряд:</b> 2.5%/сутки\n<b>Ресурс:</b> 50 циклов
        #LOC_RB_descDet_AgZn = Перезаряжаемый потомок серебряно-оксидных аккумуляторов. Отлично подходит для быстрых разрядов, но не ждите, что он прослужит вам долго.

        #LOC_RB_title_NiH2 = Никель-водородный
        #LOC_RB_short_NiH2 = NiH2
        #LOC_RB_descSum_NiH2 = <b>С-рейтинг:</b> 0.3C\n<b>Теплопотери:</b> 15% (макс. T°: 410 K)\n<b>Саморазряд:</b> 15%/сутки\n<b>Ресурс:</b> 20,000 циклов
        #LOC_RB_descDet_NiH2 = По сравнению с другими перезаряжаемыми аккумуляторами, никель-водородный обеспечивает хорошую удельную энергию и очень долгий срок службы, что делает его идеальным для аппаратов, выполняющих длительные миссии.

        #LOC_RB_title_Zebra = КЕРБ
        #LOC_RB_short_Zebra = КЕРБ
        #LOC_RB_descSum_Zebra = <b>С-рейтинг:</b> 1C\n<b>Теплопотери:</b> 10% (макс. T°: 1000 K)\n<b>Саморазряд:</b> 0%\n<b>Ресурс:</b> 4,500 циклов
        #LOC_RB_descDet_Zebra = К.Е.Р.Б. (калиевая экзотермическая ракетная батарея) не очень мощная, но не теряет свой заряд со временем, а также не боится перегрева. Вполне вероятно, что она переживет все остальные части вашего аппарата. <#FF0000>Требуется достичь рабочей температуры перед эксплуатацией.</color>

        #LOC_RB_title_Li_ion = Литий-ионный
        #LOC_RB_short_Li_ion = Li-Ion
        #LOC_RB_descSum_Li_ion = <b>С-рейтинг:</b> 1C\n<b>Теплопотери:</b> 15% (макс. T°: 480 K)\n<b>Саморазряд:</b> 1%/сутки\n<b>Ресурс:</b> 1,000 циклов
        #LOC_RB_descDet_Li_ion = Этот перезаряжаемый аккумулятор предлагает отличный баланс между энергоёмкостью, массой и сроком службы. При этом он требует тщательного терморегулирования.

        #LOC_RB_title_Li_poly = Литий-полимерный
        #LOC_RB_short_Li_poly = Li-Poly
        #LOC_RB_descSum_Li_poly = <b>С-рейтинг:</b> 3C\n<b>Теплопотери:</b> 25% (макс. T°: 470 K)\n<b>Саморазряд:</b> 1.5%/сутки\n<b>Ресурс:</b> 500 циклов
        #LOC_RB_descDet_Li_poly = Гибкая и компактная разновидность литий-ионных элементов, идеально подходящая для лёгких зондов и дронов. Не нагревайте. Никогда.

        #LOC_RB_title_Graphene = Графеновый
        #LOC_RB_descSum_Graphene = <b>С-рейтинг:</b> 5C\n<b>Теплопотери:</b> 3% (макс. T°: 500 K)\n<b>Саморазряд:</b> 0.2%/сутки\n<b>Ресурс:</b> 2,500 циклов
        #LOC_RB_descDet_Graphene = Сеть из углерода и кремния, обещающая лёгкие, ёмкие аккумуляторы с молниеносным откликом. Дорого? Да. Преувеличенно? Может быть. Но кто когда-нибудь побеждал, ограничиваясь какими-то там рамками?
        
        #LOC_RB_title_SSB = Твердотельный
        #LOC_RB_short_SSB = SSB
        #LOC_RB_descSum_SSB = <b>С-рейтинг:</b> 2C\n<b>Теплопотери:</b> 5% (макс. T°: 520 K)\n<b>Саморазряд:</b> 0.3%/сутки\n<b>Ресурс:</b> 10,000 циклов
        #LOC_RB_descDet_SSB = Непревзойденный рубеж аккумуляторных технологий: никаких жидкостей, никаких взрывов (наверное). Астрономические производительность, термическая стабильность и цена, от которой ваша бухгалтерия будет рыдать.

        #LOC_RB_title_Nuke = Метастабильный гафниевый
        #LOC_RB_short_Nuke = Hf-178m2
        #LOC_RB_descSum_Nuke = <b>С-рейтинг:</b> 0.001C\n<b>Теплопотери:</b> 12% (макс. T°: 1500 K)\n<b>Полураспад:</b> ~30 years\n<#FF0000>Не перезаряжаемый</color>
        #LOC_RB_descDet_Nuke = Этот экзотический аккумулятор запасает энергию в ядерных изотопах, которые могут стимулироваться импульсом радиационно-индуцированного пульса (Р.И.П.) для разрядки по необходимости. В отличие от традиционных РИТЭГов, его мощность можно регулировать, обеспечивая отзывчивое энергоснабжение, не прибегая к полноценным ядерным реакторам.\n<#FF0000>Существует малая, но не нулевая вероятность спонтанного теплового разгона.</color>\n<#FF0000>Не может быть обслужен в полете.</color>





